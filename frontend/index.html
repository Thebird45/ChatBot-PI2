<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Widget - Wireframe Demo</title>
    <link rel="stylesheet" href="chat-widget.css">
    <style>
        /* Estilos de la página demo (solo para visualización) */
        body {
            margin: 0;
            background: #f5f5f5;
            color: #262626;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }
        
        .demo-content {
            text-align: center;
            max-width: 600px;
        }
        
        .demo-content h1 {
            font-size: 32px;
            font-weight: 600;
            color: #171717;
            margin-bottom: 16px;
        }
        
        .demo-content p {
            font-size: 16px;
            color: #525252;
            line-height: 1.6;
        }
        
        .demo-badge {
            display: inline-block;
            background: #ffffff;
            border: 1px solid #d4d4d4;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: #737373;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Contenido de demostración -->
    <div class="demo-content">
        <h1>🤖 Chatbot Widget Wireframe</h1>
        <p>
            Este es un wireframe de alta fidelidad con paleta white-label.<br>
            Haz clic en el botón flotante en la esquina inferior derecha para interactuar.
        </p>
        <span class="demo-badge">Versión para presentación al cliente</span>
    </div>
    
    <!-- El widget se inyecta dinámicamente vía JavaScript -->
    <script src="chat-widget.js"></script>
</body>
</html>
